<svg class="dark " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696.79 1492.21" width="696.79" height="1492.21">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans', sans-serif; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
.node-shape { fill: var(--nodeBkg, var(--_node-fill)); stroke: var(--nodeBorder, var(--_node-stroke)); stroke-width: var(--_node-stroke-width, 1px); }
.node-circle-inner { fill: none; stroke: var(--nodeBorder, var(--_node-stroke)); stroke-width: var(--_node-stroke-width, 1px); }
.node-subroutine-divider { stroke: var(--nodeBorder, var(--_node-stroke)); stroke-width: var(--_node-stroke-width, 1px); }
.node-label { fill: var(--nodeTextColor, var(--_text)); }
.edge { fill: none; stroke: var(--_line); stroke-width: 1.5; }
.edge-label-text { fill: var(--_text-sec); }
.edge-label-bg { fill: var(--bg); stroke: var(--_inner-stroke); stroke-width: 1.0; }
.subgraph-box { fill: var(--_group-fill); stroke: var(--_node-stroke); stroke-width: 1.0; }
.subgraph-header { fill: var(--_group-hdr); stroke: var(--_node-stroke); stroke-width: 1.0; }
.subgraph-title { fill: var(--_text-sec); font-weight: 600; }</style>
